# .github/workflows/breadth_daily.yml
name: Breadth Composite Daily

on:
  repository_dispatch:
    types: [run-breadth]

  # schedule:
  #   - cron: "30 10 * * 1-5"   # 17:30 ICT (UTC+7), Mon–Fri

  workflow_dispatch:
    inputs:
      full_fetch:
        description: "Force full 6-year re-fetch (true/false)"
        required: false
        default: "false"
      send_email:
        description: "Send email after export (true/false)"
        required: false
        default: "false"
      probe_only:
        description: "Only run the live endpoint probe, skip the pipeline (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

# One writer at a time: two runs would race on the OHLCV cache.
concurrency:
  group: breadth-composite
  cancel-in-progress: false

jobs:
  build:
    name: Build Breadth Report
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest

      # A per-run cache key is required: Actions caches are immutable, so a
      # fixed key would freeze the Parquet at the first successful run and every
      # later "incremental" run would start from that stale snapshot.
      - name: Restore OHLCV cache
        uses: actions/cache/restore@v4
        with:
          path: output/breadth_data_cache.parquet
          key: ohlcv-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ohlcv-cache-${{ runner.os }}-

      - name: Probe endpoints (diagnostic)
        if: github.event.inputs.probe_only == 'true'
        run: python tools/probe_yuanta.py --json output/probe_yuanta.json

      - name: Run pipeline
        if: github.event.inputs.probe_only != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ID:    ${{ secrets.TELEGRAM_ID }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.full_fetch }}" = "true" ] || \
             [ "${{ github.event.client_payload.full_fetch }}" = "true" ]; then
            FLAGS="$FLAGS --full"
          fi
          if [ "${{ github.event.inputs.send_email }}" = "true" ]; then
            FLAGS="$FLAGS --send-email"
          fi
          echo "python main.py ${FLAGS}"
          python main.py ${FLAGS}

      - name: Save OHLCV cache
        if: always() && hashFiles('output/breadth_data_cache.parquet') != ''
        uses: actions/cache/save@v4
        with:
          path: output/breadth_data_cache.parquet
          key: ohlcv-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v4
        with:
          name: breadth-report-${{ github.run_id }}
          path: output/breadth_composite.xlsx
          if-no-files-found: warn
          retention-days: 30

      - name: Upload probe report
        if: always() && hashFiles('output/probe_yuanta.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: probe-report-${{ github.run_id }}
          path: output/probe_yuanta.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: breadth-chart-${{ github.run_id }}
          path: output/breadth_chart.png
          if-no-files-found: warn
          retention-days: 30

  send-email:
    name: Send Email Report
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    if: false    # Disabled — giữ code để dùng lại sau nếu cần

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Excel artifact
        uses: actions/download-artifact@v4
        with:
          name: breadth-report-${{ github.run_id }}
          path: output/

      - name: Send email
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS:   ${{ secrets.EMAIL_RECIPIENTS }}
          PYTHONUNBUFFERED:   "1"
        run: |
          python - <<'EOF'
          import sys, os
          sys.path.insert(0, ".")
          excel = "output/breadth_composite.xlsx"
          if not os.path.exists(excel):
              print("Excel not found — aborting"); sys.exit(1)
          from main import _send_email
          _send_email(excel)
          EOF
